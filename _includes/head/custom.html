{% assign social_image = page.header.overlay_image | default: site.logo_path %}
{% assign social_description = page.excerpt | default: site.description %}
{% assign social_title = page.title | default: site.title %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ social_title | markdownify | strip_html | strip_newlines | escape_once }}">
<meta name="twitter:description" content="{{ social_description | markdownify | strip_html | strip_newlines | escape_once }}">
<meta name="twitter:image" content="{{ social_image | absolute_url }}">
<meta name="twitter:image:alt" content="{{ page.header.image_description | default: site.title | escape_once }}">
